<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Six-team reseeded playoff bracket with payouts</title>
<desc id="desc">The regular-season champion receives 120 dollars. In Week 15, seed 3 plays seed 6 and seed 4 plays seed 5; seeds 1 and 2 receive byes. In Week 16, seed 1 plays the lowest-seeded Round 1 winner and seed 2 plays the highest-seeded Round 1 winner. In Week 17, the champion receives 300 dollars and the runner-up receives 180 dollars. A tied playoff matchup is won by the higher seed.</desc>
<defs>
  <linearGradient id="pink"><stop stop-color="#ff3297"/><stop offset="1" stop-color="#ff78ad"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#20b9d7"/><stop offset="1" stop-color="#70d9e8"/></linearGradient>
  <linearGradient id="violet"><stop stop-color="#8d6bd1"/><stop offset="1" stop-color="#b99aff"/></linearGradient>
</defs>
<rect width="1200" height="790" rx="24" fill="#171b27"/>
<g font-family="Arial,sans-serif">
  <text x="42" y="54" fill="#fff" font-size="29" font-weight="800" letter-spacing="1.8">THE SIX-TEAM PLAYOFF</text>
  <text x="42" y="83" fill="#aeb6c8" font-size="14" letter-spacing="1.7">WEEKS 15–17 · RESEEDING FORMAT</text>
  <rect x="42" y="105" width="1116" height="70" rx="13" fill="#242b3b" stroke="#414b61"/>
  <text x="68" y="133" fill="#ff83b8" font-size="12" font-weight="800" letter-spacing="1.8">REGULAR-SEASON CHAMPION</text>
  <text x="68" y="158" fill="#fff" font-size="21" font-weight="800">#1 regular-season finish</text>
  <text x="1128" y="154" text-anchor="end" fill="#ff83b8" font-size="34" font-weight="800">$120</text>
  <g fill="#aeb6c8" font-size="13" font-weight="800" letter-spacing="1.3">
    <text x="54" y="220">ROUND 1 · WEEK 15</text>
    <text x="452" y="220">RESEEDED SEMIFINALS · WEEK 16</text>
    <text x="930" y="220">CHAMPIONSHIP · WEEK 17</text>
  </g>
  <g>
    <rect x="42" y="242" width="315" height="126" rx="13" fill="#242b3b" stroke="#46516a" stroke-width="2"/>
    <rect x="42" y="242" width="6" height="126" rx="3" fill="url(#cyan)"/>
    <text x="66" y="270" fill="#aeb6c8" font-size="11" font-weight="800">MATCHUP 1</text>
    <text x="66" y="311" fill="#fff" font-size="25" font-weight="800">#3 Seed</text>
    <path d="M66 323 H330" stroke="#46516a"/>
    <text x="66" y="353" fill="#fff" font-size="25" font-weight="800">#6 Seed</text>
    <rect x="42" y="392" width="315" height="126" rx="13" fill="#242b3b" stroke="#46516a" stroke-width="2"/>
    <rect x="42" y="392" width="6" height="126" rx="3" fill="url(#cyan)"/>
    <text x="66" y="420" fill="#aeb6c8" font-size="11" font-weight="800">MATCHUP 2</text>
    <text x="66" y="461" fill="#fff" font-size="25" font-weight="800">#4 Seed</text>
    <path d="M66 473 H330" stroke="#46516a"/>
    <text x="66" y="503" fill="#fff" font-size="25" font-weight="800">#5 Seed</text>
    <rect x="42" y="545" width="315" height="72" rx="12" fill="#1c3540" stroke="#277d91"/>
    <text x="66" y="573" fill="#70d9e8" font-size="11" font-weight="800" letter-spacing="1">FIRST-ROUND BYES</text>
    <text x="66" y="592" fill="#fff" font-size="21" font-weight="800">#1 and #2 advance</text>
    <text x="330" y="592" text-anchor="end" fill="#70d9e8" font-size="15" font-weight="800">#1 SEED · $120</text>
  </g>
  <g fill="none" stroke="#20b9d7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M357 305 H385 V400"/>
    <path d="M357 455 H385 V400"/>
    <path d="M385 400 H415 V326 H425"/>
    <path d="M385 400 H415 V486 H425"/>
  </g>
  <g>
    <rect x="435" y="260" width="385" height="132" rx="13" fill="#242b3b" stroke="#8d6bd1" stroke-width="2"/>
    <rect x="435" y="260" width="6" height="132" rx="3" fill="url(#violet)"/>
    <text x="462" y="290" fill="#c7a8ff" font-size="11" font-weight="800">SEMIFINAL 1</text>
    <text x="462" y="331" fill="#fff" font-size="25" font-weight="800">#1 Seed</text>
    <text x="462" y="365" fill="#fff" font-size="17">vs. lowest-seeded Round 1 winner</text>
    <rect x="435" y="420" width="385" height="132" rx="13" fill="#242b3b" stroke="#8d6bd1" stroke-width="2"/>
    <rect x="435" y="420" width="6" height="132" rx="3" fill="url(#violet)"/>
    <text x="462" y="450" fill="#c7a8ff" font-size="11" font-weight="800">SEMIFINAL 2</text>
    <text x="462" y="491" fill="#fff" font-size="25" font-weight="800">#2 Seed</text>
    <text x="462" y="525" fill="#fff" font-size="17">vs. highest-seeded Round 1 winner</text>
  </g>
  <text x="627" y="590" text-anchor="middle" fill="#c7a8ff" font-size="12" font-weight="800">RESEEDING: LOWER NUMBER = HIGHER SEED</text>
  <g fill="none" stroke="#8d6bd1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M820 326 H865 V406 H895"/>
    <path d="M820 486 H865 V406"/>
  </g>
  <path d="M885 396 L897 406 L885 416" fill="none" stroke="#8d6bd1" stroke-width="2.5"/>
  <rect x="905" y="300" width="253" height="214" rx="15" fill="#392235" stroke="#ff3297" stroke-width="2"/>
  <text x="1031" y="337" text-anchor="middle" fill="#ff83b8" font-size="12" font-weight="800" letter-spacing="1">CHAMPIONSHIP</text>
  <text x="1031" y="375" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">WEEK 17</text>
  <path d="M936 392 H1126" stroke="#70445e"/>
  <text x="1031" y="427" text-anchor="middle" fill="#ff83b8" font-size="11" font-weight="800">CHAMPION</text>
  <text x="1031" y="464" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">$300</text>
  <text x="1031" y="491" text-anchor="middle" fill="#d7b5c9" font-size="11" font-weight="700">RUNNER-UP · $180</text>
  <rect x="42" y="670" width="1116" height="72" rx="13" fill="#242b3b" stroke="#414b61"/>
  <text x="68" y="699" fill="#aeb6c8" font-size="11" font-weight="800" letter-spacing="1.2">PLAYOFF MATCHUP TIEBREAKER</text>
  <text x="68" y="724" fill="#fff" font-size="17" font-weight="700">If a matchup ends tied, the higher seed advances.</text>
  <text x="1128" y="723" text-anchor="end" fill="#aeb6c8" font-size="11">No separate Round 1 or semifinal payout</text>
</g>
</svg>