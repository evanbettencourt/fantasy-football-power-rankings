<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Six-team reseeded playoff bracket and prize payouts</title>
<desc id="desc">Week 15: seed 3 plays seed 6 and seed 4 plays seed 5; seeds 1 and 2 have byes. Week 16: seed 1 plays the lowest-seeded, or worst remaining, Round 1 winner; seed 2 plays the highest-seeded, or best remaining, Round 1 winner. Week 17 is the championship. The regular-season champion receives 120 dollars, playoff champion 300 dollars, runner-up 180 dollars. No separate payout for Round 1 or semifinal wins.</desc>
<defs><linearGradient id="pink"><stop stop-color="#ff3297"/><stop offset="1" stop-color="#ff78ad"/></linearGradient><linearGradient id="cyan"><stop stop-color="#20b9d7"/><stop offset="1" stop-color="#70d9e8"/></linearGradient></defs>
<rect width="1400" height="900" rx="28" fill="#171b27"/>
<g font-family="Arial,sans-serif">
<text x="60" y="66" fill="#fff" font-size="34" font-weight="800" letter-spacing="2">THE SIX-TEAM PLAYOFF</text><text x="60" y="100" fill="#aeb6c8" font-size="16" letter-spacing="2">WEEKS 15–17 · RESEEDING FORMAT</text>
<rect x="60" y="128" width="1280" height="82" rx="15" fill="#242b3b" stroke="#414b61"/>
<text x="88" y="161" fill="#ff83b8" font-size="13" font-weight="700" letter-spacing="2">REGULAR-SEASON AWARD</text><text x="88" y="190" fill="#fff" font-size="23" font-weight="800">#1 regular-season finish</text><text x="1300" y="185" text-anchor="end" fill="#ff83b8" font-size="36" font-weight="800">$120</text>
<g fill="#aeb6c8" font-size="14" font-weight="700" letter-spacing="1.5"><text x="72" y="260">ROUND 1 · WEEK 15</text><text x="520" y="260">RESEEDED SEMIFINALS · WEEK 16</text><text x="1115" y="260">FINAL · WEEK 17</text></g>
<g><rect x="60" y="282" width="350" height="132" rx="14" fill="#242b3b" stroke="#46516a" stroke-width="2"/><rect x="60" y="282" width="7" height="132" rx="3" fill="url(#cyan)"/><text x="88" y="314" fill="#aeb6c8" font-size="12" font-weight="700">MATCHUP 1</text><text x="88" y="358" fill="#fff" font-size="27" font-weight="800">#3 Seed</text><path d="M88 370 H380" stroke="#46516a"/><text x="88" y="402" fill="#fff" font-size="27" font-weight="800">#6 Seed</text>
<rect x="60" y="438" width="350" height="132" rx="14" fill="#242b3b" stroke="#46516a" stroke-width="2"/><rect x="60" y="438" width="7" height="132" rx="3" fill="url(#cyan)"/><text x="88" y="470" fill="#aeb6c8" font-size="12" font-weight="700">MATCHUP 2</text><text x="88" y="514" fill="#fff" font-size="27" font-weight="800">#4 Seed</text><path d="M88 526 H380" stroke="#46516a"/><text x="88" y="558" fill="#fff" font-size="27" font-weight="800">#5 Seed</text>
<rect x="60" y="602" width="350" height="70" rx="13" fill="#1c3540" stroke="#277d91"/><text x="86" y="631" fill="#70d9e8" font-size="12" font-weight="800" letter-spacing="1">FIRST-ROUND BYES</text><text x="86" y="655" fill="#fff" font-size="21" font-weight="800">#1 and #2 advance</text></g>
<path d="M410 348 H458 V465 H500 M410 504 H458 V465 M410 637 H458 V570 H500" fill="none" stroke="#20b9d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 455 L502 465 L490 475" fill="none" stroke="#20b9d7" stroke-width="3"/>
<rect x="510" y="405" width="240" height="160" rx="15" fill="#2a263b" stroke="#8d6bd1" stroke-width="2"/><text x="630" y="443" text-anchor="middle" fill="#c7a8ff" font-size="14" font-weight="800" letter-spacing="2">RESEED</text><text x="630" y="482" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">Rank both Round 1</text><text x="630" y="508" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">winners by seed</text><text x="630" y="540" text-anchor="middle" fill="#aeb6c8" font-size="12">Best seed = lower number</text>
<path d="M750 485 H790 V350 H825 M790 485 V510 H825" fill="none" stroke="#8d6bd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M815 340 L827 350 L815 360 M815 500 L827 510 L815 520" fill="none" stroke="#8d6bd1" stroke-width="3"/>
<rect x="835" y="282" width="285" height="132" rx="14" fill="#242b3b" stroke="#8d6bd1" stroke-width="2"/><rect x="835" y="282" width="7" height="132" rx="3" fill="#8d6bd1"/><text x="862" y="314" fill="#c7a8ff" font-size="12" font-weight="800">SEMIFINAL 1</text><text x="862" y="355" fill="#fff" font-size="25" font-weight="800">#1 Seed</text><text x="862" y="385" fill="#fff" font-size="17">vs. lowest-seeded winner</text>
<rect x="835" y="438" width="285" height="132" rx="14" fill="#242b3b" stroke="#8d6bd1" stroke-width="2"/><rect x="835" y="438" width="7" height="132" rx="3" fill="#8d6bd1"/><text x="862" y="470" fill="#c7a8ff" font-size="12" font-weight="800">SEMIFINAL 2</text><text x="862" y="511" fill="#fff" font-size="25" font-weight="800">#2 Seed</text><text x="862" y="541" fill="#fff" font-size="17">vs. highest-seeded winner</text>
<text x="978" y="613" text-anchor="middle" fill="#c7a8ff" font-size="13" font-weight="800">LOWEST SEED = WORST SEED</text><text x="978" y="635" text-anchor="middle" fill="#aeb6c8" font-size="12">Example: #6 is lower than #3</text>
<path d="M1120 348 H1162 V426 H1185 M1120 504 H1162 V426" fill="none" stroke="#ff3297" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1175 416 L1187 426 L1175 436" fill="none" stroke="#ff3297" stroke-width="3"/>
<rect x="1195" y="354" width="145" height="145" rx="15" fill="#392235" stroke="#ff3297" stroke-width="2"/><text x="1267" y="391" text-anchor="middle" fill="#ff83b8" font-size="13" font-weight="800">CHAMPIONSHIP</text><text x="1267" y="431" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">WEEK 17</text><path d="M1220 447 H1314" stroke="#70445e"/><text x="1267" y="479" text-anchor="middle" fill="#ff83b8" font-size="16" font-weight="800">CHAMPION</text>
<rect x="60" y="720" width="1280" height="126" rx="16" fill="#242b3b" stroke="#414b61"/><text x="88" y="754" fill="#aeb6c8" font-size="13" font-weight="800" letter-spacing="2">PLAYOFF PAYOUTS</text>
<text x="88" y="803" fill="#fff" font-size="20" font-weight="800">Playoff champion</text><text x="310" y="804" fill="#ff83b8" font-size="29" font-weight="800">$300</text>
<text x="500" y="803" fill="#fff" font-size="20" font-weight="800">Runner-up</text><text x="650" y="804" fill="#ff83b8" font-size="29" font-weight="800">$180</text>
<text x="840" y="774" fill="#aeb6c8" font-size="12" font-weight="800" letter-spacing="1">NO SEPARATE ROUND PAYOUT</text><text x="840" y="803" fill="#fff" font-size="18">Round 1 and semifinal wins</text>
<text x="88" y="830" fill="#aeb6c8" font-size="11">The $120 regular-season champion award is paid separately above.</text>
</g></svg>